<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .ascii { font-family: 'Courier New', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="760" height="340" rx="14" fill="#0d0221"/>

  <!-- self-drawing neon border -->
  <rect x="6" y="6" width="748" height="328" rx="12"
        fill="none" stroke="url(#borderGrad)" stroke-width="2.5"
        stroke-dasharray="2152" stroke-dashoffset="2152">
    <animate attributeName="stroke-dashoffset" from="2152" to="0"
             dur="2.2s" fill="freeze" begin="0s"/>
  </rect>

  <!-- title bar -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
    <circle cx="30" cy="30" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="30" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="30" r="6" fill="#27c93f"/>
    <text x="380" y="35" text-anchor="middle" class="mono" font-size="13" fill="#c084fc">cxqok@spider.sh — terminal</text>
  </g>

  <!-- header divider -->
  <line x1="0" y1="52" x2="760" y2="52" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1">
    <animate attributeName="stroke-opacity" from="0" to="0.3" dur="0.4s" begin="2.4s" fill="freeze"/>
  </line>

  <!-- vertical divider between ASCII panel and boot log -->
  <line x1="280" y1="60" x2="280" y2="322" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1">
    <animate attributeName="stroke-opacity" from="0" to="0.25" dur="0.4s" begin="2.6s" fill="freeze"/>
  </line>
  <text x="26" y="68" class="mono" font-size="10" fill="#7c3aed" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.6s" fill="freeze"/>
    SPIDER.crawl
  </text>

  <!-- ================= LEFT: CRAWLING ASCII SPIDER (4 frame walk-cycle, loops every 4.5s) ================= -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.8s" fill="freeze"/>

    <!-- FRAME 1 : legs wide, top-left -->
    <text x="40" y="88" class="ascii" fill="#c084fc">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1"
                dur="4.5s" begin="2.8s" repeatCount="indefinite"/>
      <tspan x="40" dy="0">\   |   /</tspan>
      <tspan x="40" dy="1.2em"> \  |  /</tspan>
      <tspan x="40" dy="1.2em">  \ | /</tspan>
      <tspan x="40" dy="1.2em">---(o.o)---</tspan>
      <tspan x="40" dy="1.2em">  / | \</tspan>
      <tspan x="40" dy="1.2em"> /  |  \</tspan>
      <tspan x="40" dy="1.2em">/   |   \</tspan>
    </text>

    <!-- FRAME 2 : legs narrow, drifting down-right -->
    <text x="90" y="138" class="ascii" fill="#22d3ee">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.50;1"
                dur="4.5s" begin="2.8s" repeatCount="indefinite"/>
      <tspan x="90" dy="0"> \  |  /</tspan>
      <tspan x="90" dy="1.2em">  \ | /</tspan>
      <tspan x="90" dy="1.2em">   \|/</tspan>
      <tspan x="90" dy="1.2em">---(o.o)---</tspan>
      <tspan x="90" dy="1.2em">   /|\</tspan>
      <tspan x="90" dy="1.2em">  / | \</tspan>
      <tspan x="90" dy="1.2em"> /  |  \</tspan>
    </text>

    <!-- FRAME 3 : legs wide again, further down-right -->
    <text x="140" y="188" class="ascii" fill="#c084fc">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.73;0.75;1"
                dur="4.5s" begin="2.8s" repeatCount="indefinite"/>
      <tspan x="140" dy="0">\   |   /</tspan>
      <tspan x="140" dy="1.2em"> \  |  /</tspan>
      <tspan x="140" dy="1.2em">  \ | /</tspan>
      <tspan x="140" dy="1.2em">---(o.o)---</tspan>
      <tspan x="140" dy="1.2em">  / | \</tspan>
      <tspan x="140" dy="1.2em"> /  |  \</tspan>
      <tspan x="140" dy="1.2em">/   |   \</tspan>
    </text>

    <!-- FRAME 4 : legs narrow, near bottom -->
    <text x="185" y="238" class="ascii" fill="#22d3ee">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1"
                dur="4.5s" begin="2.8s" repeatCount="indefinite"/>
      <tspan x="185" dy="0"> \  |  /</tspan>
      <tspan x="185" dy="1.2em">  \ | /</tspan>
      <tspan x="185" dy="1.2em">   \|/</tspan>
      <tspan x="185" dy="1.2em">---(o.o)---</tspan>
      <tspan x="185" dy="1.2em">   /|\</tspan>
      <tspan x="185" dy="1.2em">  / | \</tspan>
      <tspan x="185" dy="1.2em"> /  |  \</tspan>
    </text>

    <!-- faint web thread trailing the crawl path -->
    <path d="M 70 92 Q 130 150 170 200 T 225 245" fill="none" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3,4"/>
  </g>

  <!-- ================= RIGHT: BOOT LOG ================= -->
  <g class="mono" font-size="15" fill="#e879f9">
    <text x="308" y="90" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.8s" fill="freeze"/>
      &gt; initializing arachnid_core...
    </text>
    <text x="308" y="118" opacity="0" fill="#a855f7">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.4s" fill="freeze"/>
      &gt; spinning web.exe [OK]
    </text>
    <text x="308" y="146" opacity="0" fill="#a855f7">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.0s" fill="freeze"/>
      &gt; scanning target.net [OK]
    </text>
    <text x="308" y="174" opacity="0" fill="#22d3ee">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.6s" fill="freeze"/>
      &gt; access granted — welcome_
    </text>

    <!-- blinking cursor -->
    <rect x="522" y="162" width="10" height="16" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.6s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer status -->
  <text x="26" y="308" class="mono" font-size="12" fill="#7c3aed" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="5.2s" fill="freeze"/>
    STATUS: ONLINE  ·  UPTIME: 24/7  ·  MODE: BUILD
  </text>
  <circle cx="730" cy="304" r="5" fill="#27c93f" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
