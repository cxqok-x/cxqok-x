<svg width="700" height="320" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Courier New', monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="700" height="320" rx="14" fill="#0d0221"/>

  <!-- self-drawing neon border -->
  <rect x="6" y="6" width="688" height="308" rx="12"
        fill="none" stroke="url(#borderGrad)" stroke-width="2.5"
        stroke-dasharray="1992" stroke-dashoffset="1992">
    <animate attributeName="stroke-dashoffset" from="1992" to="0"
             dur="2.2s" fill="freeze" begin="0s"/>
  </rect>

  <!-- title bar -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
    <circle cx="30" cy="30" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="30" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="30" r="6" fill="#27c93f"/>
    <text x="350" y="35" text-anchor="middle" class="mono" font-size="13" fill="#c084fc">arifhaxn@profile.md — terminal</text>
  </g>

  <!-- divider -->
  <line x1="0" y1="52" x2="700" y2="52" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1">
    <animate attributeName="stroke-opacity" from="0" to="0.3" dur="0.4s" begin="2.4s" fill="freeze"/>
  </line>

  <!-- boot / typing sequence -->
  <g class="mono" font-size="15" fill="#e879f9">
    <text x="26" y="90" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.8s" fill="freeze"/>
      &gt; initializing profile_core...
    </text>
    <text x="26" y="118" opacity="0" fill="#a855f7">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.4s" fill="freeze"/>
      &gt; loading system.info [OK]
    </text>
    <text x="26" y="146" opacity="0" fill="#a855f7">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.0s" fill="freeze"/>
      &gt; fetching github.stats [OK]
    </text>
    <text x="26" y="174" opacity="0" fill="#22d3ee">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.6s" fill="freeze"/>
      &gt; access granted — welcome_
    </text>

    <!-- blinking cursor -->
    <rect x="240" y="162" width="10" height="16" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.6s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer status -->
  <text x="26" y="290" class="mono" font-size="12" fill="#7c3aed" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="5.2s" fill="freeze"/>
    STATUS: ONLINE  ·  UPTIME: 24/7  ·  MODE: BUILD
  </text>
  <circle cx="670" cy="286" r="5" fill="#27c93f" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
